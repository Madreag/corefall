[workspace]
resolver = "2"
members = [
  "crates/cf-app",
  "crates/cf-sim-core",
  "crates/cf-terrain",
  "crates/cf-physics",
  "crates/cf-material",
  "crates/cf-atmos",
  "crates/cf-environment",
  "crates/cf-actor",
  "crates/cf-chassis",
  "crates/cf-equipment",
  "crates/cf-perception",
  "crates/cf-squad",
  "crates/cf-ai",
  "crates/cf-mission",
  "crates/cf-replay",
  "crates/cf-control",
  "crates/cfctl",
  "crates/cf-e2e",
  "crates/cf-save",
  "crates/cf-net",
  "crates/cf-render-2d",
  "crates/cf-capture",
  "crates/cf-ui",
  "crates/cf-audio",
  "crates/cf-mod",
  "crates/cf-asset-ledger",
  "crates/cf-tools-editor",
  "crates/cf-tools-replay-viewer",
  "crates/cf-headless",
  "crates/cf-server",
  "crates/cf-server-ops",
  "crates/cf-server-persistence",
  "crates/cf-server-anti-cheat",
  "crates/cf-server-admin",
  "crates/cf-bench",
  "crates/cf-priority",
  "crates/cf-camera",
  "crates/cf-debug",
  "crates/cf-localization",
  "crates/cf-photo",
  "crates/cf-replay-scrub",
  "crates/cf-killcam",
  "crates/cf-squad-ui",
  "crates/cf-shell",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
bevy = { version = "=0.18.1", default-features = false, features = ["bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_ui", "bevy_ui_render", "default_font", "tonemapping_luts", "ktx2", "zstd_rust", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12.1"
thiserror = "2.0.18"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand_xoshiro = "0.8.0"
rand_core = "0.10.1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
tokio-tungstenite = "0.29.0"
schemars = "1.2.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
futures-util = "0.3"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
crossbeam-channel = "0.5"
fs2 = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = true
