[package]
name = "cf-tools-replay-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cf_tools_replay_viewer"
path = "src/lib.rs"

[[bin]]
name = "cf-tools-replay-viewer"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
blake3 = { workspace = true }
cf-replay = { path = "../cf-replay" }
cf-replay-export = { path = "../cf-replay-export" }
# cf-render-2d wired in for the M10B editor's `scrub_to` preview pane:
# the editor renders the requested tick via the offline software
# rasterizer (`--features offline`) so the preview is bit-identical
# to the offline-export reference (VAL-M10B-028).
cf-render-2d = { path = "../cf-render-2d", default-features = false, features = ["offline"] }
cf-save = { path = "../cf-save" }

[dev-dependencies]
tempfile = "3"
