[package]
name = "cf-material-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# **M15B § GPU Material Kernel + Precipitation Cycle**.
#
# GPU compute pipeline lives behind the `gpu` feature; the deterministic
# CPU fallback is always built and is the canonical truth path for
# replays per DR-036 + DR-052. When the `gpu` feature is disabled (the
# default), the kernel auto-selects the CPU fallback with a one-shot
# info log. Per the M15B spec § "Notes for the implementer".

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
cf-terrain = { path = "../cf-terrain" }
cf-material = { path = "../cf-material" }
wgpu = { version = "26", optional = true, default-features = false, features = ["wgsl", "metal", "vulkan", "gles", "dx12"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
hex = { workspace = true }
cf-physics = { path = "../cf-physics" }
